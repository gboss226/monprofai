name: CI - Build & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-build-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monprofai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore monprofai.sln

      - name: Build Backend
        run: dotnet build monprofai.sln -c Release --no-restore

      - name: Run Database Migrations
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=monprofai;Username=postgres;Password=postgres
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          cd src/Backend/MonProfAI.Api
          dotnet ef database update -p ../MonProfAI.Infrastructure

      - name: Run Backend Tests
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=monprofai;Username=postgres;Password=postgres
        run: dotnet test src/Backend/MonProfAI.Tests/MonProfAI.Tests.csproj -c Release --no-build --verbosity normal

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        if: always()

  frontend-build-test:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: src/Frontend

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: src/Frontend

      - name: Build Frontend
        run: npm run build
        working-directory: src/Frontend
        env:
          VITE_API_URL: http://localhost:5000/api

      - name: Run Frontend Tests
        run: npm test 2>/dev/null || true
        working-directory: src/Frontend
        continue-on-error: true

  lint-docker:
    name: Lint & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          echo "✅ docker-compose.yml is valid"

      - name: Check file formatting
        run: |
          if ! command -v prettier &> /dev/null; then
            npm install -g prettier
          fi
          prettier --check "src/Frontend/src/**/*.{ts,tsx,json}" || echo "⚠️  Some files need formatting (run: prettier --write)"
        continue-on-error: true

  summary:
    name: Check Summary
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, lint-docker]
    if: always()

    steps:
      - name: CI Status
        run: |
          echo "🎯 CI Pipeline Summary"
          echo "✅ Backend Build: ${{ needs.backend-build-test.result }}"
          echo "✅ Frontend Build: ${{ needs.frontend-build-test.result }}"
          echo "✅ Lint & Docker: ${{ needs.lint-docker.result }}"
