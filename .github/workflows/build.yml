name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/Backend/MonProfAI.Api/MonProfAI.Api.csproj

      - name: Build
        run: dotnet build src/Backend/MonProfAI.Api/MonProfAI.Api.csproj -c Release --no-restore

      - name: Test
        run: dotnet test src/Backend/ -c Release --no-build --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd src/Frontend && npm install

      - name: Build
        run: cd src/Frontend && npm run build

      - name: Type check
        run: cd src/Frontend && npx tsc --noEmit
