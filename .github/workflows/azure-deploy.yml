name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Backend/MonProfAI.Api/MonProfAI.Api.csproj

      - name: Build
        run: dotnet build src/Backend/MonProfAI.Api/MonProfAI.Api.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/Backend/MonProfAI.Api/MonProfAI.Api.csproj -c Release -o publish --no-build

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: monprofai-api
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: publish

      - name: Run migrations
        run: |
          cd src/Backend/MonProfAI.Infrastructure
          dotnet ef database update -s ../MonProfAI.Api
        continue-on-error: true

  deploy-frontend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: src/Frontend

      - name: Build
        run: npm run build
        working-directory: src/Frontend
        env:
          VITE_API_URL: https://monprofai-api.azurewebsites.net/api

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "src/Frontend/dist"
          output_location: "src/Frontend/dist"
