version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: monprofai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monprofai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: monprofai-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=monprofai;Username=postgres;Password=postgres
      JwtSettings__Secret: your-super-secret-key-change-this-in-production-at-least-32-characters-long!
    ports:
      - "5000:8080"
    volumes:
      - ../../src/Backend:/app/src

volumes:
  postgres_data:
